name: SystemVerilog Code Style Lint

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull files down onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Grab the official stable linux-static release path
    - name: Install Native Verible Toolchain
      run: |
        # Download using a dynamic variable pattern targeting the verified static binary layout
        export VERIBLE_VERSION="v0.0-3622-g07b310a3"
        wget https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz
        
        # Extract files cleanly 
        tar -xzf verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz
        
        # Add the binary path directly to the GitHub runner environment
        echo "$PWD/verible-${VERIBLE_VERSION}/bin" >> $GITHUB_PATH

    # Step 3: Enforce strict lint checking
    - name: Execute Strict Lint Evaluation
      run: |
        # Using -print0 and xargs -0 handles file/folder names with blank spaces cleanly
        find . \( -name "*.v" -o -name "*.sv" \) -print0 | xargs -0 verible-verilog-lint --rules_config=.rules.verible_lint

