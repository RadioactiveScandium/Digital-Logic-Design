name: SystemVerilog Code Style Lint

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull your files down onto the machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Grab the official standalone compiled Verible binary tools
    - name: Install Native Verible Toolchain
      run: |
        wget https://github.com
        tar -xzf verible-v0.0-3899-g75c38daf-Ubuntu-22.04-x86_64.tar.gz
        echo "$PWD/verible-v0.0-3899-g75c38daf/bin" >> $GITHUB_PATH

    # Step 3: Run the check on every .v and .sv file natively
    - name: Execute Strict Lint Evaluation
      run: |
        # Find all verilog/systemverilog files and feed them to the linter tool
        find . -name "*.v" -o -name "*.sv" | xargs verible-verilog-lint --rules_config=.rules.verible_lint
