name: SystemVerilog Code Style Lint

on:
  # Trigger the workflow on every push event to ANY branch or tag
  push:
    branches:
      - '**'
    tags:
      - '**'
  
  # Keep this to show line-by-line annotations inside pull requests
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel any in-progress runs if you push a new commit quickly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Verible Linter
      uses: chipsalliance/verible-linter-action@main
      with:
        fail_on_error: true
        github_token: ${{ secrets.GITHUB_TOKEN }}
